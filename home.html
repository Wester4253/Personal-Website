<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- EDITABLE: Site title shown in browser tab -->
    <title>Westr42</title>
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
    <meta name="referrer" content="origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: blob: data: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https: blob: data:; frame-src 'self' https://www.youtube.com https://youtube.com https://www.youtube-nocookie.com;">
    <style>
        :root {
            --primary: #2a2a72;
            --secondary: #009ffd;
            --text: #333;
            --background: rgba(245, 245, 245, 0.1);
            --mouse-trail-intensity: 50%;
            --background-blur: 5px;
            --animation-speed: 1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: transparent;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            color: white;
            position: relative;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            object-fit: cover;
            filter: brightness(0.6);
        }

        #mouseTrail {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(5px);
            padding: 2rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
        }

        header {
            margin-bottom: 4rem;
            opacity: 0;
            transform: translateY(-20px);
            animation: fadeInDown 1s forwards;
        }

        h1 {
            color: white;
            font-size: clamp(2rem, 5vw, 3.5rem);
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: clamp(1rem, 2vw, 1.2rem);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            max-width: 800px;
            margin: 0 auto;
            gap: 2rem;
            padding: 1rem;
        }

        .nav-button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            padding: 2rem;
            border-radius: 15px;
            cursor: pointer;
            text-decoration: none;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            transform: translateY(20px);
            backdrop-filter: blur(5px);
        }

        .nav-button:nth-child(1) { animation: fadeInUp 0.5s 0.2s forwards; }
        .nav-button:nth-child(2) { animation: fadeInUp 0.5s 0.4s forwards; }

        .nav-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity 0.4s;
            z-index: 1;
        }

        .nav-button:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .nav-button:hover::before {
            opacity: 0.2;
        }

        .button-content {
            position: relative;
            z-index: 2;
            transition: transform 0.3s;
        }

        .nav-button:hover .button-content {
            transform: scale(1.05);
        }

        .icon {
            font-size: 2rem;
            margin-bottom: 1rem;
            display: block;
            transition: transform 0.3s;
        }

        .nav-button:hover .icon {
            transform: scale(1.2) rotate(5deg);
        }

        .button-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .button-description {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        #content-sections {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: none;
            z-index: 1000;
        }

        #content-sections.active {
            display: block;
        }

        .content-section {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 800px;
            padding: 2rem;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 15px;
            color: white;
        }

        .content-section.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        .back-button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 1rem;
            backdrop-filter: blur(5px);
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .contact-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 10px;
            margin-top: 1rem;
            backdrop-filter: blur(5px);
        }
        
        .contact-info p {
            font-size: 1.1rem;
            margin: 0.5rem 0;
        }
        
        .contact-info strong {
            color: var(--secondary);
        }

        /* Music Player Styles */
        .music-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1002;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .youtube-input-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: none;
            align-items: center;
            gap: 5px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 8px;
            border-radius: 8px;
            z-index: 1001;
        }

        .youtube-input-container.visible {
            display: flex;
        }

        .youtube-input {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            color: white;
            width: 250px;
        }

        .youtube-submit, .music-toggle {
            background: rgba(0, 0, 0, 0.8);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            transition: background 0.3s ease;
        }

        .youtube-submit:hover, .music-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .music-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1002;
        }

        .music-toggle.hidden {
            display: none;
        }

        .player-container {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 1px;
            height: 1px;
            opacity: 0;
        }

        .stats-container {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px;
            width: 300px;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }

        .stats-container.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }

        .song-info {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .media-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .text-container {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 60px;
        }

        .song-thumbnail {
            width: 100px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
        }

        .song-title {
            font-weight: bold;
            font-size: 1.1em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 8px;
        }

        .song-artist {
            font-size: 0.9em;
            opacity: 0.8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .control-button {
            background: rgba(0, 0, 0, 0.8);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s ease, background-color 0.3s ease;
            color: white;
            font-size: 20px;
            backdrop-filter: blur(5px);
        }

        .control-button:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.2);
        }

        .play-icon, .pause-icon {
            width: 24px;
            height: 24px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .play-icon {
            background-image: url('https://cdn-icons-png.freepik.com/512/14034/14034663.png');
        }

        .pause-icon {
            background-image: url('https://cdn-icons-png.freepik.com/512/14034/14034650.png');
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 3px;
            position: absolute;
            top: 0;
            left: 0;
            transition: width 0.1s linear;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            opacity: 0.8;
        }

        .close-player {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .close-player:hover {
            opacity: 1;
        }

        /* Animations */
        @keyframes fadeInDown {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -48%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .nav-grid {
                gap: 1rem;
            }

            .nav-button {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="mouseTrail"></canvas>
    
    <!-- EDITABLE: Background video path -->
    <video autoplay muted loop class="video-background">
        <source src="./content/home-bg.mp4" type="video/mp4">
    </video>

    <div class="container">
        <header>
            <!-- EDITABLE: Main page heading -->
            <h1>Welcome to My Website</h1>
            <!-- EDITABLE: Subtitle text -->
            <p class="subtitle">Explore and connect with me</p>
        </header>

        <div id="main-content">

            <!-- Navigation buttons -->
            <div class="nav-grid">
                <button data-content="about" class="nav-button">
                    <div class="button-content">
                        <span class="icon">👤</span>
                        <h2 class="button-title">About</h2>
                        <p class="button-description">Who am i?</p>
                    </div>
                </button>

                <button data-content="contact" class="nav-button">
                    <div class="button-content">
                        <span class="icon">📧</span>
                        <h2 class="button-title">Contact</h2>
                        <p class="button-description">Shoot me a message!</p>
                    </div>
                </button>
            </div>
        </div>

        <!-- Content sections overlay -->
        <div id="content-sections">
            <!-- EDITABLE: About section content -->
            <div id="about-content" class="content-section">
                <button class="back-button">← Back</button>
                <h2>About Me</h2>
                <p>Welcome! i am a budding coder currently in highschool. i use arch (btw), like open source software, and like to game.</p>
            </div>

            <!-- EDITABLE: Contact section content -->
            <div id="contact-content" class="content-section">
                <button class="back-button">← Back</button>
                <h2>Contact Me</h2>
                <div class="contact-info">
                    <!-- EDITABLE: Discord username -->
                    <p><strong>Discord:</strong> westerneagle42</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Music Player UI -->
    <div class="music-controls">
        <div class="youtube-input-container">
            <input type="text" class="youtube-input" placeholder="Enter YouTube URL or video ID">
            <button class="youtube-submit">Play</button>
        </div>
        <button class="music-toggle">🎵</button>
    </div>

    <div id="player-container" class="player-container">
        <div id="youtube-player"></div>
    </div>

    <div class="stats-container">
        <button class="close-player">✕</button>
        <div class="song-info">
            <div class="media-row">
                <img class="song-thumbnail" src="" alt="Video thumbnail">
                <div class="text-container">
                    <div class="song-title">No song playing</div>
                    <div class="song-artist">Unknown artist</div>
                </div>
                <button class="control-button play-pause-btn">
                    <div class="play-icon"></div>
                    <div class="pause-icon" style="display: none;"></div>
                </button>
            </div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <div class="time-info">
                <span class="current-time">0:00</span>
                <span class="duration">0:00</span>
            </div>
        </div>
    </div>

    <!-- External JavaScript files -->
    <script src="js/mouseTrail.js"></script>
    <script>
        // ===== CONTENT NAVIGATION =====
        const mainContent = document.getElementById('main-content');
        const contentSections = document.getElementById('content-sections');
        const panelButtons = document.querySelectorAll('[data-content]');
        const backButtons = document.querySelectorAll('.back-button');

        function showContent(contentId) {
            contentSections.classList.add('active');
            mainContent.style.display = 'none';
            
            document.querySelectorAll('.content-section').forEach(section => {
                section.classList.remove('active');
            });
            
            const selectedContent = document.getElementById(`${contentId}-content`);
            if (selectedContent) {
                selectedContent.classList.add('active');
            }
        }

        function showMainContent() {
            contentSections.classList.remove('active');
            mainContent.style.display = 'block';
            
            document.querySelectorAll('.content-section').forEach(section => {
                section.classList.remove('active');
            });
        }

        panelButtons.forEach(button => {
            button.addEventListener('click', () => {
                const contentId = button.getAttribute('data-content');
                showContent(contentId);
            });
        });

        backButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                e.preventDefault();
                showMainContent();
            });
        });
    </script>
    <script src="js/musicPlayer.js"></script>
</body>
</html>
